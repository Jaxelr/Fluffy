name: .NET

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Fluffy.sln
      - name: Build
        run: dotnet build Fluffy.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Fluffy.sln --configuration Release --no-build --no-restore
      - name: Check formatting and code style
        run: dotnet format Fluffy.sln --verify-no-changes --severity info --no-restore
